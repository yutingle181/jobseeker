server:
  port: 8080

spring:
  application:
    name: jobseeker-server
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 做成可覆盖（原先硬编码）：迁移演练、CI 临时库、容器部署都要能切库，
    # 与下面的 username/password 保持同一种写法。
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/jobseeker?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      pool-name: JobseekerHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000

  # 数据库迁移（Flyway）。改表结构一律加 db/migration/V<版本>__<描述>.sql，
  # 不要再手工改库或手写零散 SQL —— 那样"执行过没有"永远查不出来。
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有库只做 baseline、不重跑 V1..V4：
    # 本机库的现状恰好等于 schema.sql + 三个手工增量脚本（= V1..V4 的最终结构），
    # 所以 baseline 到 4 是准确的，且数据零改动。
    # ⚠️ 改这个值前必须确认库的真实结构，否则会把「没执行过的迁移」当成执行过。
    baseline-on-migrate: true
    baseline-version: 4
    # 校验：迁移文件被改过（checksum 变了）时报错而不是悄悄跳过。
    # 这是 Flyway 最值钱的能力——它能发现"有人改了已执行过的迁移文件"。
    validate-on-migrate: true
    baseline-description: legacy-jobs (schema.sql + 3 手工增量脚本)

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id

# ---- Python Agent 对接 ----
agent:
  base-url: ${AGENT_BASE_URL:http://127.0.0.1:8000}
  api-key: ${AGENT_API_KEY:}
  connect-timeout-ms: 5000
  read-timeout-ms: 120000
  # AI 产物目录（Agent 的 Agent_output），只读
  output-dir: ${AGENT_OUTPUT_DIR:../Agent实习项目/Agent_output}
  # ---- 网关层响应缓存（相同 query+user_context 命中即返回，省掉整轮 Agent 调用）----
  chat-cache-enabled: ${AGENT_CHAT_CACHE_ENABLED:true}
  chat-cache-max-size: ${AGENT_CHAT_CACHE_MAX_SIZE:1000}
  chat-cache-ttl-seconds: ${AGENT_CHAT_CACHE_TTL:300}
  # ---- user_context 按需裁剪（按 query 相关性动态压缩 JD/简历，降 token 与 prefill，9.2.C）----
  context-compress-enabled: ${AGENT_CONTEXT_COMPRESS_ENABLED:true}
  context-jd-limit: ${AGENT_CONTEXT_JD_LIMIT:1200}
  context-resume-limit: ${AGENT_CONTEXT_RESUME_LIMIT:4000}
  # ---- 端到端监控基线（首 token 延迟 / P95 + 缓存命中率，9.2.D）----
  metrics-enabled: ${AGENT_METRICS_ENABLED:true}
  metrics-max-samples: ${AGENT_METRICS_MAX_SAMPLES:2000}
  # ---- Redis（缓存 / 分布式锁 / 限流三件套的载体）----
  # 默认 false：不装配 RedisConfig、不建连接池，服务在没装 Redis 的机器上照常启动，
  # 并自动降级为进程内实现（缓存→内存 LRU，锁→ReentrantLock，限流→内存计数），
  # 降级时会打日志并在 /agent/gateway-metrics 里可见当前生效后端。
  redis:
    enabled: ${AGENT_REDIS_ENABLED:false}
    host: ${AGENT_REDIS_HOST:127.0.0.1}
    port: ${AGENT_REDIS_PORT:6379}
    password: ${AGENT_REDIS_PASSWORD:}
    database: ${AGENT_REDIS_DB:0}
    timeout-ms: ${AGENT_REDIS_TIMEOUT_MS:1000}
    connect-timeout-ms: ${AGENT_REDIS_CONNECT_TIMEOUT_MS:1000}
    pool-max-total: ${AGENT_REDIS_POOL_MAX:32}
    pool-max-idle: ${AGENT_REDIS_POOL_MAX_IDLE:8}
    pool-min-idle: ${AGENT_REDIS_POOL_MIN_IDLE:2}
    key-prefix: ${AGENT_REDIS_KEY_PREFIX:jobseeker:}
    health-check-seconds: ${AGENT_REDIS_HEALTH_CHECK_SECONDS:30}
  # ---- 接口限流（固定窗口；Redis 不可用时降级为进程内计数，不会变成"无限流"）----
  rate-limit:
    enabled: ${AGENT_RATE_LIMIT_ENABLED:true}
    window-seconds: ${AGENT_RATE_LIMIT_WINDOW_SECONDS:60}
    max-requests: ${AGENT_RATE_LIMIT_MAX_REQUESTS:60}
    per-user: ${AGENT_RATE_LIMIT_PER_USER:true}
    retry-after-seconds: ${AGENT_RATE_LIMIT_RETRY_AFTER:60}
    key-prefix: ${AGENT_RATE_LIMIT_KEY_PREFIX:jobseeker:rl:}

# ---- 本服务文件存储 ----
storage:
  base-dir: ${STORAGE_BASE_DIR:./data}

# ---- 鉴权 ----
jwt:
  secret: ${JWT_SECRET:jobseeker-default-secret-please-change-in-production}
  expire-minutes: 1440

logging:
  level:
    root: INFO
    com.jobseeker: INFO
