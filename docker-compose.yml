version: '3.8'

# 只编排本软件的 server + web + mysql。
# Python Agent 是独立服务（在 ../Agent实习项目 下单独启动），本软件通过 HTTP 调用它。
services:
  mysql:
    image: mysql:8.0
    container_name: jobseeker-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: jobseeker
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      # 2026-10-16：这里**曾经**挂 schema.sql 到 /docker-entrypoint-initdb.d/ 让容器首次启动自动建表，
      # 现在移除——建表统一交给应用启动时的 Flyway（server/src/main/resources/db/migration/V*.sql）。
      #
      # 为什么必须换：initdb 机制只跑 schema.sql，而本机库的现状是
      # **schema.sql + 三个手工增量脚本**。也就是说容器里的结构一直缺
      # exam_done / exam_deadline / apply_url 三列和五个联合索引，与本机不一致，
      # 且这个不一致**从代码里完全看不出来**——正是手工迁移的典型代价。
      #
      # 换成 Flyway 后：容器与本机跑同一套迁移脚本，最终结构**必然一致**；
      # 且 MYSQL_DATABASE 仍会建出空库，Flyway 从 V1 顺序建表即可。
      #
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: jobseeker-server
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jobseeker?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      # Agent 服务地址（宿主上运行的 Agent 用 host.docker.internal 访问）
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://host.docker.internal:8000}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      # AI 产物目录：只读挂载 Agent 的 Agent_output
      AGENT_OUTPUT_DIR: /app/agent-output
      STORAGE_BASE_DIR: /app/data
    ports:
      - '8080:8080'
    volumes:
      - server_data:/app/data
      # 跨目录只读共享 Agent 的 AI 产物（简历导入用）
      - ../Agent实习项目/Agent_output:/app/agent-output:ro
    restart: unless-stopped

  web:
    build: ./web
    container_name: jobseeker-web
    depends_on:
      - server
    ports:
      - '80:80'
    restart: unless-stopped

volumes:
  mysql_data:
  server_data:
